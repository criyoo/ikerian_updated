name: Deploy Ikerian AWS Data Pipeline

on:
  push:
    branches: [development, feature/*]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  # Security and validation checks
  security-scan:
    name: Security Scan & Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-terraform
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Security Commands
        uses: ./.github/actions/terraform-commands
        with:
          commands: "fmt init validate"

      - name: Run TFSec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .

      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

# Development environment deployment
  plan-dev:
    name: Plan for Development Deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment: development
    
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-terraform
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select Terraform Workspace
        run: terraform workspace select dev || terraform workspace new dev

      - name: Run Terraform Commands
        uses: ./.github/actions/terraform-commands
        with:
          commands: "init plan"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-dev
          path: tfplan

      - name: Notify Plan Success
        if: success()
        run: |
          echo "🚀 Development plan completed successfully!"
          echo "Environment: Development"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

